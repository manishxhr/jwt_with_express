
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Auth System</title>
    <link rel="stylesheet" href="/publicHTML/css/style.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="brand">
                <div class="brand-icon">A</div>
                <span>AuthSystem</span>
            </div>
            <div class="auth-heading">
                <h1>Welcome back</h1>
                <p>Sign in to continue to your account.</p>
            </div>
            <form id="loginForm">
                <p id="message" class="message"></p>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >
                </div>


                <button type="submit" id="loginBtn">
                    Sign in
                </button>

            </form>

            <p class="auth-footer">
                Don't have an account?
                <a href="/register">Create account</a>
            </p>

        </section>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const messageDiv = document.getElementById("message");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            // Clear previous messages
            messageDiv.textContent = "";
            messageDiv.style.color = "";

            try {
                const apiHost = window.location.hostname || "localhost";
                const response = await fetch(`http://${apiHost}:2000/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    messageDiv.textContent = data.message || "Login failed";
                    messageDiv.style.color = "#e53e3e";
                    console.error("Login error:", data);
                    return;
                }

                // Save tokens
                // if (data.token) {
                //     // localStorage.setItem("token", data.token);
                //     // localStorage.setItem("refreshToken", data.refreshToken);
                //     // res.cookie("token", data.token, { httpOnly: true, secure: true });
                //     // res.cookie("refreshToken", data.refreshToken, { httpOnly: true, secure: true });
                // }

                

                // Login successful
                messageDiv.textContent = "Login successful! Redirecting...";
                messageDiv.style.color = "#38a169";
                console.log("Login response:", data);
                setTimeout(() => {
                    window.location.href = "/dashboardjs"; // Redirect to dashboard or home page
                }, 1000);
                // window.location.href = "./../authenticated/dashboard.html"; // Redirect to dashboard or home page


            } catch (error) {
                messageDiv.textContent = "An error occurred. Please try again.";
                messageDiv.style.color = "#e53e3e";
                console.error("Fetch error:", error);
            }
        });
    </script>
    <!-- <script src="js/auth.js"></script> -->
</body>
</html>
